[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaPhos"
dynamic = ["version"]
description = "Phosphoproteomics analysis toolkit — IO, preprocessing, PTM site mapping, statistics, KSEA, enrichment, kinase-substrate signalome, orthology, dimensionality reduction and QC."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Oliinyk", email = "oliinyk@biochem.mpg.de" },
]
keywords = ["phosphoproteomics", "mass-spectrometry", "proteomics", "PTM", "KSEA", "kinase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=10",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
stats = [
    "inmoose>=0.9.1",
    "patsy>=0.5",
]
enrichment = [
    "gseapy>=1.1",
    "decoupler>=2.0",
    "omnipath>=1.0",
]
dimred = [
    "umap-learn>=0.5",
]
qc = [
    "bokeh>=3.0",   # generate_dashboard (v1 dashboard composer)
    "plotly>=5",    # v2 panels (retention_time_drift, psm_counts, run_tic, contaminant_fraction)
    "kaleido>=0.2", # plotly static image export (write_image)
]
pimms = [
    "pimms-learn>=0.5",  # Webel et al. 2024 Nat Commun; wraps torch + fastai
]
all = [
    # Convenience: install every non-dev/docs runtime extra.  Kept in sync
    # with the extras above.
    "inmoose>=0.9.1",
    "patsy>=0.5",
    "gseapy>=1.1",
    "decoupler>=2.0",
    "omnipath>=1.0",
    "umap-learn>=0.5",
    "bokeh>=3.0",
    "plotly>=5",
    "kaleido>=0.2",
    "pimms-learn>=0.5",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/DenysOliinyk3007/alphaPhos"
Documentation = "https://github.com/DenysOliinyk3007/alphaPhos/tree/main/docs"
Issues = "https://github.com/DenysOliinyk3007/alphaPhos/issues"
Changelog = "https://github.com/DenysOliinyk3007/alphaPhos/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/alphaphos/_version.py"

[tool.hatch.build.targets.sdist]
# Source distribution = package + tests + docs + metadata.  Research artefacts
# and the repo-level FASTAs (~140 MB together) are not part of the release.
# Patterns are gitignore-style; the leading "/" anchors them to the repo root so
# that "src/alphaphos/resources/" (shipped) is NOT matched by "/resources/".
exclude = [
    "/resources/",
    "/prob_weighted_benchmark/",
    "/docs/benchmark/",
    "/examples/",
    "/studies/",
    "/scripts/",
    "/.github/",
    "/.pre-commit-config.yaml",
]

[tool.hatch.build.targets.wheel]
# Data under src/alphaphos/resources/ (contaminants.fasta, goldstandard/,
# libraries/) ships with the wheel; the ~84 MB FASTAs stay in the repo-level
# resources/ and are located at runtime via alphaphos.resources.external().
packages = ["src/alphaphos"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",          # line length handled by formatter
    "RUF002",        # ambiguous unicode in docstrings (× / – are intentional in math notation)
    "RUF003",        # ambiguous unicode in comments (same)
    "RUF015",        # next(...) vs [0]: stylistic, [0] is clearer for known-nonempty
    "RUF022",        # __all__ ordering: we order by export logical groups, not alphabet
    "RUF043",        # pytest match= regex flag: only matters with metacharacters
    "SIM102",        # nested if: sometimes clearer than `and`-chain
    "SIM108",        # ternary vs if-else: ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
# Example notebooks (jupytext percent-format) use trailing expressions to
# print the last value (standard Jupyter idiom) and Unicode chars in
# markdown strings (×, ≥, ...).  Neither is a real defect in that context.
"examples/*" = ["B018", "F541", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
source = ["src/alphaphos"]
branch = true
