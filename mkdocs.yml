site_name: alphaPhos
site_description: Phosphoproteomics analysis toolkit
repo_url: https://github.com/oliinyk/alphaPhos
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Modules:
    - IO (import):
      - Overview: modules/io/index.md
      - alphaphos.io.spectronaut: modules/io/spectronaut.md
      - alphaphos.io.diann: modules/io/diann.md
      - alphaphos.io.fragpipe: modules/io/fragpipe.md
    - Preprocess:
      - Overview: modules/preprocess/index.md
      - alphaphos.preprocess.collapse: modules/preprocess/collapse.md
      - alphaphos.preprocess.collapse_precursors: modules/preprocess/collapse_precursors.md
      - alphaphos.preprocess.filter: modules/preprocess/filter.md
      - alphaphos.preprocess.impute: modules/preprocess/imputation.md
      - alphaphos.preprocess.batch_correct: modules/preprocess/batch_correct.md
    - Stats:
      - alphaphos.stats.diff_exp: modules/stats/index.md
    - Enrichment:
      - Overview: modules/enrichment/index.md
      - alphaphos.enrichment.ksea: modules/enrichment/ksea.md
      - alphaphos.enrichment.pathway: modules/enrichment/pathway.md
      - alphaphos.enrichment.pathway_gsea: modules/enrichment/pathway_gsea.md
  - Design:
    - PhosphoExperiment schema: design/phosphoexperiment.md
  - API:
    - alphaphos.io: api/io.md
    - alphaphos.preprocess: api/preprocess.md
    - alphaphos.ptm: api/ptm.md
    - alphaphos.stats: api/stats.md
    - alphaphos.ksea: api/ksea.md
    - alphaphos.enrichment: api/enrichment.md
    - alphaphos.acquisition: api/acquisition.md
    - alphaphos.viz: api/viz.md
    - alphaphos.qc: api/qc.md
