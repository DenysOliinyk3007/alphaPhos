[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaPhos"
version = "0.0.0"
description = "Phosphoproteomics analysis toolkit — IO, preprocessing, PTM site mapping, statistics, KSEA, enrichment, acquisition, QC and visualization."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Oliinyk", email = "oliinyk@biochem.mpg.de" },
]
keywords = ["phosphoproteomics", "mass-spectrometry", "proteomics", "PTM", "KSEA", "kinase"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
r = [
    "rpy2>=3.5",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/oliinyk/alphaPhos"
Documentation = "https://github.com/oliinyk/alphaPhos"
Issues = "https://github.com/oliinyk/alphaPhos/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaphos"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",          # line length handled by formatter
    "RUF002",        # ambiguous unicode in docstrings (× / – are intentional in math notation)
    "RUF003",        # ambiguous unicode in comments (same)
    "RUF015",        # next(...) vs [0]: stylistic, [0] is clearer for known-nonempty
    "RUF022",        # __all__ ordering: we order by export logical groups, not alphabet
    "RUF043",        # pytest match= regex flag: only matters with metacharacters
    "SIM102",        # nested if: sometimes clearer than `and`-chain
    "SIM108",        # ternary vs if-else: ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "regression: golden-snapshot regression tests against legacy pipelines",
    "slow: tests that take more than a few seconds",
    "requires_r: tests that need an R/rpy2 install",
]

[tool.coverage.run]
source = ["src/alphaphos"]
branch = true
